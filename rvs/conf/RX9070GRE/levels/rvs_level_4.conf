# RX9070GRE test level 4 - extended performance
# RDNA4 Radeon level suite (no HBM/babel or XGMI/pbqt).
# GST target_stress and IET target_power sourced from RX9070GRE/gst_single.conf and RX9070GRE/iet_single.conf.
# IET target_power = 220 W.


actions:
- name: pcie_d2h_bandwidth
  device: all
  module: pebb
  duration: 30000
  device_to_host: true
  host_to_device: false
  parallel: false
  block_size: 1073741824
  link_type: 2

- name: pcie_h2d_bandwidth
  device: all
  module: pebb
  duration: 30000
  device_to_host: false
  host_to_device: true
  parallel: false
  block_size: 1073741824
  link_type: 2

- name: memtest
  device: all
  module: mem
  parallel: true
  count: 1
  wait: 100
  mapped_memory: false
  mem_blocks: 128
  num_passes: 500
  thrds_per_blk: 64
  stress: true
  num_iter: 50000
  exclude: 9 10

- name: compute-fp16
  device: all
  module: gst
  parallel: true
  count: 1
  duration: 10000
  ramp_interval: 2000
  log_interval: 3000
  max_violations: 1
  copy_matrix: false
  target_stress: 90000
  tolerance: 0.07
  matrix_size_a: 4096
  matrix_size_b: 4096
  matrix_size_c: 4096
  data_type: fp16_r
  compute_type: fp32_r
  lda: 4128
  ldb: 4128
  ldc: 4128
  ldd: 4128
  blas_source: hipblaslt
  transa: 1
  transb: 0

- name: compute-fp8
  device: all
  module: gst
  parallel: true
  count: 1
  duration: 10000
  ramp_interval: 2000
  log_interval: 3000
  max_violations: 1
  copy_matrix: false
  target_stress: 195000
  tolerance: 0.07
  matrix_size_a: 4096
  matrix_size_b: 4096
  matrix_size_c: 4096
  data_type: fp8_e4m3_r
  compute_type: fp32_r
  lda: 4128
  ldb: 4128
  ldc: 4128
  ldd: 4128
  blas_source: hipblaslt
  transa: 1
  transb: 0

- name: compute-i8
  device: all
  module: gst
  parallel: true
  count: 1
  duration: 10000
  ramp_interval: 2000
  log_interval: 3000
  max_violations: 1
  copy_matrix: false
  target_stress: 140000
  tolerance: 0.07
  matrix_size_a: 4096
  matrix_size_b: 4096
  matrix_size_c: 4096
  data_type: i8_r
  compute_type: i32_r
  lda: 4128
  ldb: 4128
  ldc: 4128
  ldd: 4128
  blas_source: hipblaslt
  transa: 1
  transb: 0

- name: power-stress
  device: all
  module: iet
  parallel: true
  duration: 60000
  ramp_interval: 10000
  sample_interval: 5000
  log_interval: 5000
  max_violations: 1
  target_power: 220
  tolerance: 0.01
  matrix_size: 10640
  ops_type: sgemm
  blas_source: rocblas

