# gfx1151 test level 2 - hardware capability checks
# Strix Halo APU level suite (no HBM/babel, XGMI/pbqt, or PCIe link/peqt).
# GST target_stress and IET target_power sourced from gfx1151/gst_single.conf and gfx1151/iet_single.conf.
# IET target_power = 90 W (sgemm), PPT: whole package, CPU included.

actions:
- name: pcie_interface
  device: all
  module: pebb
  duration: 20000
  device_to_host: false
  host_to_device: true
  parallel: true
  block_size: 67108864
  link_type: 2

