# GPIM (GPU Performance Integrity Monitor) - baseline creation
#
# Runs each enabled probe baseline_runs times per GPU on an idle, healthy node
# and stores per-GPU baselines in baseline_path. Run gpim_single.conf later to
# compare against these baselines.
#
# Preconditions:
#   GPUs must be idle (no other workloads) while baselines are recorded.
#   The process needs write access to baseline_path.
#   Re-create baselines after ROCm, driver, firmware or GPU partition changes.
#
actions:
- name: gpim_baseline
  device: all
  module: gpim
  parallel: false
  mode: baseline
  baseline_path: /var/lib/rvs/gpim_baselines.json
  baseline_runs: 25                 # samples per probe per GPU
  baseline_record_hostname: false   # write hostname into the baseline file
  probe_kernel_launch_enabled: true
  probe_gemm_enabled: true
  probe_memory_bandwidth_enabled: true
  probe_driver_overhead_enabled: true
  probe_rocm_version_enabled: true
