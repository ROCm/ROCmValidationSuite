# nv31 test level 5 - full stress test
# Navi Radeon level suite (no HBM/babel or XGMI/pbqt).
# GST target_stress and IET target_power sourced from nv31/gst_single.conf and nv31/iet_single.conf.
# IET target_power = 127 W.


actions:
- name: pcie_d2h_bandwidth
  device: all
  module: pebb
  duration: 900000
  device_to_host: true
  host_to_device: false
  parallel: false
  block_size: 1073741824
  link_type: 2

- name: pcie_h2d_bandwidth
  device: all
  module: pebb
  duration: 900000
  device_to_host: false
  host_to_device: true
  parallel: false
  block_size: 1073741824
  link_type: 2

- name: memtest
  device: all
  module: mem
  parallel: true
  count: 20
  wait: 100
  mapped_memory: false
  mem_blocks: 128
  num_passes: 500
  thrds_per_blk: 64
  stress: true
  num_iter: 200000
  exclude: 9 10

- name: compute-sgemm
  device: all
  module: gst
  parallel: true
  count: 1
  duration: 900000
  ramp_interval: 2000
  log_interval: 3000
  max_violations: 1
  copy_matrix: false
  target_stress: 10000
  tolerance: 0.07
  matrix_size_a: 8640
  matrix_size_b: 8640
  matrix_size_c: 8640
  ops_type: sgemm
  lda: 8640
  ldb: 8640
  ldc: 8640

- name: compute-hgemm
  device: all
  module: gst
  parallel: true
  count: 1
  duration: 900000
  ramp_interval: 2000
  log_interval: 3000
  max_violations: 1
  copy_matrix: false
  target_stress: 41000
  tolerance: 0.07
  matrix_size_a: 4096
  matrix_size_b: 4096
  matrix_size_c: 4096
  ops_type: hgemm
  lda: 4096
  ldb: 4096
  ldc: 4096

- name: power-stress
  device: all
  module: iet
  parallel: true
  duration: 3600000
  ramp_interval: 10000
  sample_interval: 5000
  log_interval: 5000
  max_violations: 1
  target_power: 127
  tolerance: 0.01
  matrix_size: 8640
  ops_type: sgemm
  blas_source: rocblas

