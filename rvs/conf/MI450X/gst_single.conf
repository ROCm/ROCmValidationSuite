actions:
- name: gst-4K*4K*32K-trig-fp8
  device: all
  module: gst
  log_interval: 3000
  ramp_interval: 2000
  duration: 10000
  parallel: true
  hot_calls: 60
  copy_matrix: false
  target_stress: 0
  matrix_size_a: 4096
  matrix_size_b: 4096
  matrix_size_c: 32768
  matrix_init: trig
  data_type: fp8_e4m3_r
  out_data_type: fp32_r
  compute_type: fp32_r
  lda: 0
  ldb: 0
  ldc: 0
  ldd: 0
  transa: 0
  transb: 0
  alpha: 1
  beta: 0
  rotating: 512
  blas_source: hipblaslt

