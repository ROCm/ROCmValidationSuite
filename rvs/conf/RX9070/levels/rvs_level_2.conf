# RX9070 test level 2 - hardware capability checks
# RDNA4 Radeon level suite (no HBM/babel or XGMI/pbqt).
# GST target_stress and IET target_power sourced from RX9070/gst_single.conf and RX9070/iet_single.conf.
# IET target_power = 220 W.

actions:
- name: pcie_capability
  device: all
  module: peqt
  capability:
    link_cap_max_speed:
    link_cap_max_width:
    link_stat_cur_speed:
    link_stat_neg_width:
    slot_pwr_limit_value:
    slot_physical_num:
    deviceid:
    vendor_id:
    kernel_driver:

- name: pcie_interface
  device: all
  module: pebb
  duration: 20000
  device_to_host: false
  host_to_device: true
  parallel: true
  block_size: 67108864
  link_type: 2

