# Pulse power test (gfx1201)
#
# Preconditions:
#   device: all, parallel: true. Run on an idle system.
#   patterns: all runs six waveforms, 60 seconds each.
#   GEMM operation and matrix size match this ASIC's IET power workload.
#   min_power_delta_w is 0 until a swing limit has been measured.
#
# Run test with:
#   cd bin
#   ./rvs -c conf/gfx1201/pulse_single.conf
#
# Expected result:
#   Each primary GPU passes if every selected pattern completes with no GEMM,
#   HIP, thermal, or uncorrectable-ECC failure and at least one power sample.
#

actions:
- name: pulse-all-patterns
  device: all
  module: pulse
  parallel: true
  duration: 360000
  pattern_duration: 60000
  patterns: all
  sample_interval: 100
  log_interval: 5000
  ops_type: sgemm
  matrix_size: 10640
  blas_source: rocblas
  alpha: 1.0
  beta: 1.0
  matrix_init: hiprand
  tolerance: 10.0
  workload_iterations: 8
  halt_on_error: false
  gpu_sync_wait: 10000
  verify_mode: diff
  max_temp_c: 105
  min_power_delta_w: 0
  ecc_check: true

- name: pulse-burst-fast
  device: all
  module: pulse
  parallel: true
  duration: 180000
  pattern_duration: 60000
  patterns: 2,3,4
  sample_interval: 100
  log_interval: 5000
  ops_type: sgemm
  matrix_size: 10640
  blas_source: rocblas
  alpha: 1.0
  beta: 1.0
  matrix_init: hiprand
  tolerance: 10.0
  workload_iterations: 8
  halt_on_error: false
  gpu_sync_wait: 10000
  verify_mode: diff
  max_temp_c: 105
  min_power_delta_w: 0
  ecc_check: true

