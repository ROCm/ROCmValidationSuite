# GPIM (GPU Performance Integrity Monitor) - single validation run
#
# Runs each enabled probe once per GPU and compares the result against the
# baselines created with gpim_baseline.conf. Degradation is reported as
# WARNING / MINOR / MAJOR / CRITICAL using the percentage thresholds below.
#
# Preconditions:
#   Baselines exist at baseline_path (or set baseline_auto_create: true).
#   GPUs should be idle while the check runs.
#
actions:
- name: gpim_single
  device: all
  module: gpim
  parallel: false
  mode: single
  baseline_path: /var/lib/rvs/gpim_baselines.json
  baseline_auto_create: false
  regression_detection_enabled: true
  regression_threshold_warning: 5.0     # percent degradation
  regression_threshold_minor: 10.0
  regression_threshold_major: 20.0
  regression_threshold_critical: 50.0
  diagnostics_enabled: true
  fail_on_regression: false             # non-zero result when a regression is found
  probe_kernel_launch_enabled: true
  probe_gemm_enabled: true
  probe_memory_bandwidth_enabled: true
  probe_driver_overhead_enabled: true
  probe_rocm_version_enabled: true
